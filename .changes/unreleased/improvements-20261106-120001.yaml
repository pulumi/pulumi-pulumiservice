kind: improvements
body: 'Creating a `Team` whose `members` leaves out the user creating it now warns that Pulumi Cloud added that user to the team, and that the next update to `members` removes them. [#1348](https://github.com/pulumi/pulumi-pulumiservice/pull/1348)'
