name: pulumi-service-teams-access-token-yaml
runtime: yaml
description: An example of using yaml to create a team token
config:
  # When the expiring token expires, as an RFC 3339 date-time. Pulumi Cloud
  # rejects expiries in the past or more than two years out, so the test
  # passes a date relative to the current time.
  expires:
    type: string
resources:
  rand:
    type: random:RandomString
    properties:
      length: 5
      # team names may only contain alphanumeric, hyphens, underscores, or periods
      special: false
  team:
    type: pulumiservice:index:Team
    properties:
      name: brand-new-yaml-team-${rand.result}
      organizationName: service-provider-test-org
      displayName: PulumiUP Team
      teamType: pulumi
      members:
        - pulumi-bot
        - service-provider-example-user
  token:
    type: pulumiservice:index:TeamAccessToken
    properties:
      teamName: ${team.name}
      organizationName: service-provider-test-org
      description: "example team access token"
  expiringToken:
    type: pulumiservice:index:TeamAccessToken
    properties:
      teamName: ${team.name}
      organizationName: service-provider-test-org
      description: "example team access token with an expiry"
      expires: ${expires}
