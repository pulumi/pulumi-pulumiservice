name: yaml-deployment-settings-example
runtime: yaml
description: Deployment settings test
resources:
  my_settings:
    type: pulumiservice:DeploymentSettings
    properties:
      organization: service-provider-test-org
      project: yaml-deployment-settings-example
      stack: test-stack-${digits}
      executorContext:
        executorImage: "pulumi/pulumi-nodejs:latest"
        # Credentials are only required when executorImage lives in a private
        # registry. The image above is public; these are here to exercise the
        # credentials path.
        credentials:
          username: ${imageUsername}
          password: ${imagePassword}
      sourceContext:
        git:
          repoUrl: "https://github.com/pulumi/deploy-demos.git"
          branch: "refs/heads/main"
          repoDir: "pulumi-programs/simple-resource"
      operationContext:
        preRunCommands:
          - yarn
          - ls -al
        environmentVariables:
          TEST_VAR: "test-value"
        options:
          skipInstallDependencies: true
      cacheOptions:
        enable: true
