resources:
  # DeploymentSettings is a singleton-per-stack — it requires the stack to
  # already exist on the backend.
  parentStack:
    type: pulumiservice:api/stacks:Stack
    properties:
      orgName: ${organizationName}
      projectName: ${projectName}
      stackName: ${stackName}
  settings:
    type: pulumiservice:api/deployments:Settings
    properties:
      orgName: ${organizationName}
      projectName: ${projectName}
      stackName: ${stackName}
      executorContext:
        executorImage: pulumi-cli
      operationContext:
        preRunCommands:
          - yarn
        environmentVariables:
          TEST_VAR: foo
        options:
          skipInstallDependencies: true
      # With a GitHub VCS integration the repository comes from `vcs`;
      # repoUrl is rejected in that combination.
      vcs:
        provider: github
        repository: example/example
      sourceContext:
        git:
          branch: refs/heads/main
    options:
      dependsOn:
        - ${parentStack}
