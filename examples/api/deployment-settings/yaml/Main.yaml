resources:
  # DeploymentSettings is a singleton-per-stack — it requires the stack to
  # already exist on the backend.
  parentStack:
    type: pulumiservice:api/stacks:Stack
    properties:
      orgName: ${organizationName}
      projectName: ${projectName}
      stackName: ${stackName}
  settings:
    type: pulumiservice:api/deployments:Settings
    properties:
      orgName: ${organizationName}
      projectName: ${projectName}
      stackName: ${stackName}
      executorContext:
        executorImage: pulumi-cli
      operationContext:
        preRunCommands:
          - yarn
        environmentVariables:
          TEST_VAR: foo
        options:
          skipInstallDependencies: true
      # `provider: custom` rather than github: Pulumi Cloud checks that the
      # Pulumi GitHub app is installed for the repository a github block names,
      # and this repo is a placeholder. The variants are wire-identical, so
      # custom exercises the same union. With a `vcs` block the repository
      # comes from `vcs`; repoUrl is rejected in that combination.
      vcs:
        provider: custom
        repository: example/example
      sourceContext:
        git:
          branch: refs/heads/main
    options:
      dependsOn:
        - ${parentStack}
