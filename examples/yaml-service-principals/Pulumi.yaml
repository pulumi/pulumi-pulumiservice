name: yaml-service-principals-example
runtime: yaml
description: A service principal with a role and entity access, and deployments that run as it or with a role
config:
  organizationName:
    type: string
    default: service-provider-test-org
  digits:
    type: string
variables:
  readerRole:
    fn::invoke:
      function: pulumiservice:getOrganizationRole
      arguments:
        organizationName: ${organizationName}
        name: Reader
  maintainerRole:
    fn::invoke:
      function: pulumiservice:getOrganizationRole
      arguments:
        organizationName: ${organizationName}
        name: Maintainer
resources:
  deployer:
    type: pulumiservice:ServicePrincipal
    properties:
      organizationName: ${organizationName}
      name: test-sp-deployer-${digits}
      roleIds:
        - ${readerRole.roleId}
  environment:
    type: pulumiservice:Environment
    properties:
      organization: ${organizationName}
      project: test-sp-project-${digits}
      name: deploy-config
      yaml:
        fn::stringAsset: |-
          values:
            region: us-west-2
  deployerEnvironmentAccess:
    type: pulumiservice:OrganizationMemberEntityAccess
    properties:
      organizationName: ${organizationName}
      username: ${deployer.login}
      entityType: environment
      entityName: ${environment.project}/${environment.name}
      permission: environment-open
  servicePrincipalStack:
    type: pulumiservice:Stack
    properties:
      organizationName: ${organizationName}
      projectName: test-sp-project-${digits}
      stackName: runs-as-service-principal
  deployerStackAccess:
    type: pulumiservice:OrganizationMemberEntityAccess
    properties:
      organizationName: ${organizationName}
      username: ${deployer.login}
      entityType: stack
      entityName: ${servicePrincipalStack.projectName}/${servicePrincipalStack.stackName}
      permission: stack-write
  servicePrincipalSettings:
    type: pulumiservice:DeploymentSettings
    properties:
      organization: ${servicePrincipalStack.organizationName}
      project: ${servicePrincipalStack.projectName}
      stack: ${servicePrincipalStack.stackName}
      operationContext:
        preRunCommands:
          - ls -al
        servicePrincipal:
          login: ${deployer.login}
    options:
      # Pulumi Cloud only lets deployments run as a service principal that can
      # write to the stack.
      dependsOn:
        - ${deployerStackAccess}
  roleStack:
    type: pulumiservice:Stack
    properties:
      organizationName: ${organizationName}
      projectName: test-sp-project-${digits}
      stackName: runs-with-role
  roleSettings:
    type: pulumiservice:DeploymentSettings
    properties:
      organization: ${roleStack.organizationName}
      project: ${roleStack.projectName}
      stack: ${roleStack.stackName}
      operationContext:
        roleId: ${maintainerRole.roleId}
outputs:
  deployerLogin: ${deployer.login}
