name: yaml-team-stack-example
runtime: yaml
description: An example of using yaml to manage team stack permissions
config:
  organizationName:
    type: string
    default: service-provider-test-org
resources:
  rand:
    type: random:RandomString
    properties:
      length: 5
      # team names may only contain alphanumeric, hyphens, underscores, or periods
      special: false
  team:
    type: pulumiservice:index:Team
    properties:
      name: yaml-team-${rand.result}
      organizationName: ${organizationName}
      displayName: Team Stack Permission Example
      teamType: pulumi
      members:
        - pulumi-bot
        - service-provider-example-user
  # grant access to *this* stack to the team we're creating
  stack-permissions:
    type: pulumiservice:index:TeamStackPermission
    properties:
      organization: ${team.organizationName}
      project: yaml-team-stack-example
      stack: ${pulumi.stack}
      team: ${team.name}
      # edit access
      permission: 102
  managedStackSuffix:
    type: random:RandomPet
    properties:
      prefix: ${pulumi.stack}
      separator: "-"
  managedStack:
    type: pulumiservice:Stack
    properties:
      organizationName: ${organizationName}
      projectName: ${pulumi.project}
      stackName: ${managedStackSuffix.id}
  # grant admin access to a stack this program creates
  managed-stack-permissions:
    type: pulumiservice:index:TeamStackPermission
    properties:
      organization: ${team.organizationName}
      project: ${managedStack.projectName}
      stack: ${managedStack.stackName}
      team: ${team.name}
      # admin access
      permission: 103
