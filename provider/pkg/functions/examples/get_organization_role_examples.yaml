description: Look up a role you defined
variables:
  ciDeployerRole:
    fn::invoke:
      function: pulumiservice:getOrganizationRole
      arguments:
        organizationName: my-org
        name: CI Deployer
resources:
  platformTeamRole:
    type: pulumiservice:TeamRoleAssignment
    properties:
      organizationName: my-org
      teamName: platform
      roleId: ${ciDeployerRole.roleId}
---
description: Look up a built-in role
variables:
  adminRole:
    fn::invoke:
      function: pulumiservice:getOrganizationRole
      arguments:
        organizationName: my-org
        name: Admin
outputs:
  adminRoleId: ${adminRole.roleId}
