# Nightly refresh of the RBAC scope catalog behind the generated RbacScope and
# RbacResourceType enums. Fetches GET /api/orgs/{org}/roles/scopes from
# production Pulumi Cloud, regenerates the enums and SDKs, and opens a PR when
# anything changed. Removing an enum member is a breaking SDK change, so the PR
# is labeled for review instead of auto-merging in that case.
#
# Not generated by ci-mgmt — the `pulumiservice-` filename prefix makes ci-mgmt
# skip it on regen rather than deleting it.

name: update-rbac-scopes

on:
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC exchange for a Pulumi Cloud token.

concurrency:
  group: update-rbac-scopes
  cancel-in-progress: false

env:
  BRANCH: auto/update-rbac-scopes

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Install mise
        uses: jdx/mise-action@590bfd78fa3e93efd2e7ea21d65d397118ac1430
        env:
          MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 30s
        with:
          version: 2026.3.7
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Fetch the RBAC scope catalog
        env:
          PULUMI_ORG: pulumi
        run: scripts/fetch-rbac-scopes.sh

      - name: Regenerate enums
        run: go generate ./provider/pkg/resources/

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RBAC scope catalog unchanged."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          added=$(git diff -U0 provider/pkg/resources/zz_generated_rbac.go | grep -cE '^\+\s+RbacScope\w+\s+RbacScope = ' || true)
          removed=$(git diff -U0 provider/pkg/resources/zz_generated_rbac.go | grep -cE '^-\s+RbacScope\w+\s+RbacScope = ' || true)
          echo "added=$added" >> "$GITHUB_OUTPUT"
          echo "removed=$removed" >> "$GITHUB_OUTPUT"

      - name: Install uv (python toolchain)
        if: steps.diff.outputs.changed == 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install maven (java toolchain)
        if: steps.diff.outputs.changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Rebuild provider and SDKs
        if: steps.diff.outputs.changed == 'true'
        run: make provider build_sdks

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "Update RBAC scope enums from Pulumi Cloud"
          git push --force origin "$BRANCH"

      - name: Open or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADDED: ${{ steps.diff.outputs.added }}
          REMOVED: ${{ steps.diff.outputs.removed }}
        run: |
          set -euo pipefail
          {
            echo "Automated refresh of the RBAC scope catalog from \`GET /api/orgs/pulumi/roles/scopes\`."
            echo
            echo "- Scopes added to \`RbacScope\`: ${ADDED}"
            echo "- Scopes removed from \`RbacScope\`: ${REMOVED}"
            echo
            if [[ "$REMOVED" != "0" ]]; then
              echo "**Removing enum members is a breaking SDK change.** Confirm the scopes were retired by Pulumi Cloud, and add a \`### Breaking Changes\` entry to \`CHANGELOG.md\` before merging."
            else
              echo "Add a \`CHANGELOG.md\` entry under \`## Unreleased\` listing the new scopes before merging."
            fi
          } > /tmp/pr-body.md

          labels="automation"
          if [[ "$REMOVED" != "0" ]]; then
            labels="needs-triage"
          fi
          gh label create "$labels" --force >/dev/null 2>&1 || true

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --body-file /tmp/pr-body.md --add-label "$labels"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Update RBAC scope enums from Pulumi Cloud" \
              --body-file /tmp/pr-body.md --label "$labels"
          fi
