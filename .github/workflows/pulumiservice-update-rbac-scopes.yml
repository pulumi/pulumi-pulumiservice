# Keeps the generated Rbac*Scope enums in step with Pulumi Cloud. Fetches the
# scope catalog from production, regenerates the enums with
# scripts/gen-rbac-scopes.sh, rebuilds the schema and SDKs, and opens or updates
# a PR when anything changed.
#
# It runs weekly to pick up new scopes, and whenever go.mod changes on main,
# because the generator skips scopes the pinned pulumi-cloud-sdk/go doesn't know
# and a Renovate bump can make them available.
#
# The generator fails if a scope disappeared from the catalog, because removing
# an enum member breaks SDK users. This workflow never passes --allow-removals:
# a failed run means someone has to decide on the breaking change by hand.
#
# Not generated by ci-mgmt — the `pulumiservice-` filename prefix makes ci-mgmt
# skip it on regen rather than deleting it.

name: update-rbac-scopes

on:
  workflow_dispatch: {}
  schedule:
    - cron: "45 7 * * 1" # Mondays
  push:
    branches: [main]
    paths: [go.mod]

permissions:
  contents: read
  id-token: write # OIDC exchange for a Pulumi Cloud token.

concurrency:
  group: update-rbac-scopes
  cancel-in-progress: false

env:
  BRANCH: auto/update-rbac-scopes

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - id: esc-auth
        name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2
        with:
          export-environment-variables: "false"
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - id: esc-secrets
        name: Fetch secrets from ESC
        uses: pulumi/esc-action@ce885ce2ea6bf59194b7b0a3e94a4d3f7bacece0
        with:
          environment: github-secrets/${{ github.repository_owner }}-${{ github.event.repository.name }}
          export-environment-variables: "false"
          pulumi-access-token: ${{ steps.esc-auth.outputs.pulumi-access-token }}

      - name: Install mise
        uses: jdx/mise-action@590bfd78fa3e93efd2e7ea21d65d397118ac1430
        env:
          MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 30s
        with:
          version: 2026.3.7
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      # The enums ship in the public SDKs, so the catalog must come from an org
      # with every generally available RBAC feature and no unreleased feature
      # flags. An internal org like pulumi may have preview flags on, which
      # would add scopes customers can't use yet.
      - name: Fetch the scope catalog and regenerate the enums
        env:
          PULUMI_ACCESS_TOKEN: ${{ steps.esc-auth.outputs.pulumi-access-token }}
          PULUMI_ORG: pulumi
        run: |
          set -euo pipefail
          scripts/gen-rbac-scopes.sh 2>&1 | tee /tmp/gen.log

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RBAC scope enums are up to date."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016 # The backticks are Markdown.
          values() { grep -oE 'Rbac[A-Za-z]+Scope = "[^"]+"' | sed -E 's/ = "(.*)"/ `\1`/' | sort; }
          git show HEAD:provider/pkg/functions/zz_generated_rbac_scopes.go | values > /tmp/before.txt
          values < provider/pkg/functions/zz_generated_rbac_scopes.go > /tmp/after.txt
          comm -13 /tmp/before.txt /tmp/after.txt | sed 's/^/- /' > /tmp/added.md
          grep 'skipping' /tmp/gen.log | sed -E 's/^gen-rbac-scopes: (.*)$/- \1/' > /tmp/skipped.md || true

      - name: Install uv (python toolchain)
        if: steps.diff.outputs.changed == 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install maven (java toolchain)
        if: steps.diff.outputs.changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Rebuild provider, schema and SDKs
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          make provider schema build_sdks
          # The SDK build stamps a dev version into these files.
          git checkout -- sdk/*/pulumi-plugin.json sdk/nodejs/package.json \
            sdk/python/pyproject.toml sdk/dotnet/*.csproj sdk/java/build.gradle \
            sdk/go/pulumiservice/internal/pulumiUtilities.go

      # Push and open the PR as pulumi-bot: CI doesn't run on PRs opened with
      # GITHUB_TOKEN.
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          BOT_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "pulumi-bot"
          git config user.email "bot@pulumi.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "Update RBAC scope enums from Pulumi Cloud"
          git push --force "https://pulumi-bot:${BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$BRANCH"

      - name: Open or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "Updates the \`Rbac*Scope\` enums from the Pulumi Cloud scope catalog (\`GET /api/orgs/pulumi/roles/scopes\`), opened by \`pulumiservice-update-rbac-scopes.yml\`."
            echo
            echo "### Added scopes"
            echo
            if [[ -s /tmp/added.md ]]; then cat /tmp/added.md; else echo "None. Only descriptions or the stored catalog changed."; fi
            if [[ -s /tmp/skipped.md ]]; then
              echo
              echo "### Skipped scopes"
              echo
              echo "These are in the catalog but not in the pinned \`pulumi-cloud-sdk/go\`. A later SDK bump reruns this workflow and adds them."
              echo
              cat /tmp/skipped.md
            fi
            echo
            echo "Before merging, add a \`CHANGELOG.md\` entry for the added scopes, or the \`impact/no-changelog-required\` label if none were added."
            echo
            echo "> Each run force-pushes \`${BRANCH}\`. Push any manual edits again after a rerun."
          } > /tmp/pr-body.md

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --body-file /tmp/pr-body.md
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Update RBAC scope enums from Pulumi Cloud" \
              --body-file /tmp/pr-body.md
          fi
