# Adds the version's changie notes (.changes/<version>.md) to the top of its
# GitHub release. publish.yml is generated by ci-mgmt and builds the release
# body from the schema summary and GitHub's generated notes only, with no way
# to pass a notes file.
#
# Triggered by workflow_run because publish.yml creates the release with
# GITHUB_TOKEN, and events from that token don't start other workflows.
#
# Not generated by ci-mgmt — the `pulumiservice-` filename prefix makes ci-mgmt
# skip it on regen rather than deleting it.

name: release-notes

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to update, e.g. v1.8.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-notes-${{ inputs.version || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  add-notes:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # For a tag push, workflow_run reports the tag name as head_branch.
      VERSION: ${{ inputs.version || github.event.workflow_run.head_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSION }}

      - name: Add changie notes to the release
        run: |
          set -euo pipefail
          NOTES=".changes/$VERSION.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "::notice::$NOTES doesn't exist at $VERSION; leaving the release body as it is."
            exit 0
          fi
          MARKER='<!-- changie-notes -->'
          BODY=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          if grep -qF "$MARKER" <<<"$BODY"; then
            echo "::notice::Release $VERSION already has its changie notes."
            exit 0
          fi
          # Drop the "## X.Y.Z" heading: the release title already names the version.
          {
            echo "$MARKER"
            tail -n +2 "$NOTES" | sed '/./,$!d'
            echo
            echo "$BODY"
          } > "$RUNNER_TEMP/body.md"
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/body.md"
