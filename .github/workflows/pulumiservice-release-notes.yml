# After each stable release, makes sure the version has a changelog section
# and adds it to the top of the GitHub release.
#
# A release PR batches the changelog before the tag exists. A tag pushed any
# other way (`@release-bot`, or by hand) arrives with its fragments still in
# .changes/unreleased/. For those, this batches the fragments in the tagged
# commit, so entries merged after the tag stay unreleased, and opens a PR that
# applies the result to the default branch.
#
# publish.yml is generated by ci-mgmt and builds the release body from the
# schema summary and GitHub's generated notes only, with no way to pass a
# notes file, so the notes are added after the release exists.
#
# Triggered by workflow_run because publish.yml creates the release with
# GITHUB_TOKEN, and events from that token don't start other workflows.
#
# Not generated by ci-mgmt — the `pulumiservice-` filename prefix makes ci-mgmt
# skip it on regen rather than deleting it.

name: release-notes

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to update, e.g. v1.8.0
        required: true

permissions:
  contents: write
  id-token: write # For ESC secrets.

concurrency:
  group: release-notes-${{ inputs.version || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  add-notes:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # For a tag push, workflow_run reports the tag name as head_branch.
      VERSION: ${{ inputs.version || github.event.workflow_run.head_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSION }}
          fetch-depth: 0
          # The push below authenticates with the app token, which a stored
          # GITHUB_TOKEN header would override.
          persist-credentials: false

      - uses: miniscruff/changie-action@3223cb29b92a0972dedc864ace3da01e04780ae4 # v3.0.1
        with:
          version: v1.25.1

      - name: Batch the fragments in the tagged commit
        id: batch
        run: |
          set -euo pipefail
          NOTES=".changes/$VERSION.md"
          if [[ -f "$NOTES" ]]; then
            echo "::notice::$VERSION was batched before it was tagged."
            echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FRAGMENTS=$(find .changes/unreleased -name '*.yaml' | sort)
          if [[ -z "$FRAGMENTS" ]]; then
            echo "::notice::$VERSION has no changelog fragments; leaving the changelog and the release body as they are."
            exit 0
          fi
          changie batch "$VERSION"
          # Keep the results outside the work tree: the next step checks out
          # the default branch.
          cp "$NOTES" "$RUNNER_TEMP/notes.md"
          printf '%s\n' "$FRAGMENTS" > "$RUNNER_TEMP/fragments.txt"
          echo "notes=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          echo "batched=true" >> "$GITHUB_OUTPUT"

      - name: Add the changelog notes to the release
        if: steps.batch.outputs.notes != ''
        env:
          NOTES: ${{ steps.batch.outputs.notes }}
        run: |
          set -euo pipefail
          MARKER='<!-- changie-notes -->'
          BODY=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          if grep -qF "$MARKER" <<<"$BODY"; then
            echo "::notice::Release $VERSION already has its changelog notes."
            exit 0
          fi
          # Drop the "## X.Y.Z" heading: the release title already names the version.
          {
            echo "$MARKER"
            tail -n +2 "$NOTES" | sed '/./,$!d'
            echo
            echo "$BODY"
          } > "$RUNNER_TEMP/body.md"
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/body.md"

      - env:
          ESC_ACTION_ENVIRONMENT: github-secrets/${{ github.repository_owner }}-${{ github.event.repository.name }}
          ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: "false"
          ESC_ACTION_OIDC_AUTH: "true"
          ESC_ACTION_OIDC_ORGANIZATION: pulumi
          ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
        if: steps.batch.outputs.batched == 'true'
        id: esc-secrets
        name: Fetch secrets from ESC
        uses: pulumi/esc-action@9eb774255b1a4afb7855678ae8d4a77359da0d9b

      # A PR opened with GITHUB_TOKEN wouldn't start the checks that the
      # default branch requires before it can merge.
      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        if: steps.batch.outputs.batched == 'true'
        id: app-auth
        with:
          app-id: ${{ steps.esc-secrets.outputs.PULUMI_PROVIDER_AUTOMATION_APP_ID }}
          private-key: ${{ steps.esc-secrets.outputs.PULUMI_PROVIDER_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Open a PR that applies the batch to the default branch
        if: steps.batch.outputs.batched == 'true'
        env:
          GH_TOKEN: ${{ steps.app-auth.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BRANCH="changelog/$VERSION"
          git reset --quiet --hard
          git clean --quiet -fd
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$BRANCH" "origin/$DEFAULT_BRANCH"
          if [[ -f ".changes/$VERSION.md" ]]; then
            echo "::notice::$DEFAULT_BRANCH already has .changes/$VERSION.md."
            exit 0
          fi
          cp "$RUNNER_TEMP/notes.md" ".changes/$VERSION.md"
          # A fragment already gone from the default branch has nothing to delete.
          xargs git rm --quiet --ignore-unmatch -- < "$RUNNER_TEMP/fragments.txt"
          changie merge
          git add .changes CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Batch the changelog for $VERSION"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          if [[ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]]; then
            gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" \
              --title "Batch the changelog for $VERSION" \
              --label impact/no-changelog-required \
              --body "$VERSION was tagged without batching its changelog. This moves the fragments that were in the tagged commit under a $VERSION heading and regenerates \`CHANGELOG.md\`. Fragments merged after the tag stay unreleased."
          fi
          gh pr merge "$BRANCH" --auto --squash
